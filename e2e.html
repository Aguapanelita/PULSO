<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PULSO — E2E Test</title>
</head>
<body style="background:#050711; color:#fff; font-family:monospace;">
  <h1>PULSO E2E Test</h1>
  <iframe id="app-frame" src="index.html" style="width:1000px; height:700px; border:1px solid #333;"></iframe>

  <script>
    function report(msg, pass = true) {
      console.log((pass ? '[E2E PASS] ' : '[E2E FAIL] ') + msg);
      fetch('/test-log?status=' + (pass ? 'PASS' : 'FAIL') + '&msg=' + encodeURIComponent(msg)).catch(() => {});
    }

    const frame = document.getElementById('app-frame');
    frame.onload = async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;

      // Esperar a que app.js inicialice
      await new Promise(r => setTimeout(r, 1000));

      try {
        if (!win.pulsoApp) {
          report('pulsoApp no encontrado en ventana', false);
          fetch('/test-done').catch(() => {});
          return;
        }
        report('Aplicación PULSO inicializada en DOM');

        // Paso 1: Hacer clic en video demo
        const btnDemo = doc.getElementById('btn-demo-video');
        btnDemo.click();
        report('Disparado generador de video de ejemplo');

        // Esperar a que el video demo se genere y aparezca el botón de análisis
        let attempts = 0;
        const btnStart = doc.getElementById('btn-start-analysis');
        while (btnStart.offsetParent === null && attempts < 25) {
          await new Promise(r => setTimeout(r, 500));
          attempts++;
        }

        if (btnStart.offsetParent === null) {
          report('El botón de iniciar análisis no se mostró a tiempo', false);
          fetch('/test-done').catch(() => {});
          return;
        }
        report('Video de ejemplo cargado en memoria correctamente');

        // Paso 2: Iniciar análisis
        btnStart.click();
        report('Análisis iniciado; pantalla de procesamiento activa');

        // Esperar a que termine el análisis y llegue a la pantalla de resultado
        const screenResult = doc.getElementById('screen-result');
        attempts = 0;
        while (!screenResult.classList.contains('active') && attempts < 40) {
          await new Promise(r => setTimeout(r, 500));
          attempts++;
        }

        if (!screenResult.classList.contains('active')) {
          report('No se llegó a la pantalla de resultado tras el análisis', false);
          fetch('/test-done').catch(() => {});
          return;
        }

        report('Pantalla de resultado activa con éxito');

        // Verificar datos generados
        const app = win.pulsoApp;
        if (app.musicScore && app.musicScore.events.length > 0) {
          report(`Partitura musical generada (${app.musicScore.events.length} notas, ${app.musicScore.modeName})`);
        } else {
          report('Partitura musical vacía o no generada', false);
        }

        if (app.sculpture && app.sculpture.elements.length > 0) {
          report(`Escultura 3D creada (${app.sculpture.elements.length} filamentos y geometrías)`);
        } else {
          report('Escultura 3D sin elementos', false);
        }

        // Probar reproducción
        app.timeline.play();
        await new Promise(r => setTimeout(r, 600));
        if (app.timeline.isPlaying) {
          report('Timeline de reproducción sincronizada en ejecución');
          app.timeline.pause();
        } else {
          report('Timeline no inició reproducción', false);
        }

        // Probar exportación de audio en memoria
        const wavBlob = await app._ensureRenderedBuffer();
        if (wavBlob && wavBlob.length > 0) {
          report('Audio pre-renderizado offline disponible para exportar');
        }

        report('Flujo E2E completo completado exitosamente');
      } catch (err) {
        report('Error inesperado en E2E: ' + err.message, false);
      } finally {
        fetch('/test-done').catch(() => {});
      }
    };
  </script>
</body>
</html>
